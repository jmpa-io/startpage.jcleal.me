---
name: CI/CD
on:
  push:
    paths:
      - '.github/workflows/cicd.yml'
      - 'cf/**'
      - 'src/**'
      - 'Makefile*'
  workflow_dispatch:
  repository_dispatch:
    types: [update-cicd]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  lint:
    uses: jmpa-io/pipelines/.github/workflows/10-lint.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # v1.1.0
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  build-website:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: startpage.jcleal.me
          path: src/*
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [build-website]
    uses: jmpa-io/pipelines/.github/workflows/40-deploy-to-aws.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # v1.1.0
    with:
      templates: website
      account_id: '213851291874' # the dev AWS account.
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  upload-website:
    needs: [deploy]
    uses: jmpa-io/pipelines/.github/workflows/50-upload-artifacts-to-s3.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # v1.1.0
    with:
      artifact: startpage.jcleal.me
      account_id: '213851291874' # the dev AWS account.
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  # Prove the dev copy serves a directory URL (the home page and a subpage) before anything else
  # builds on it. CloudFront can lag a few seconds behind the stack update, so retry.
  smoke-test:
    needs: [upload-website]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS.
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::213851291874:role/${{ secrets.AWS_RUNNER_ROLE_NAME || 'github-actions' }}
          role-session-name: github-actions
          aws-region: ap-southeast-2

      - name: Fetch the dev site.
        run: |
          password=$(aws ssm get-parameter --name /common/dev-site-auth/password --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::$password"
          for path in /; do
            curl -fsS --retry 8 --retry-delay 15 --retry-all-errors -u "dev:$password" -o /dev/null "https://startpage.dev.jcleal.me${path}"
            echo "ok https://startpage.dev.jcleal.me${path}"
          done

  # Promote to prod: when this lands on main, publish the exact artifact that just passed the dev smoke test to the live
  # site (prod account), then check the live URLs. Merging to main starts the promotion; the approval gate below lets it through.
  # Approval gate: the `prod` environment (repo Settings > Environments) requires a reviewer, so the run waits here until the
  # publish is approved on GitHub. Nothing reaches prod without it.
  approve-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke-test]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Approved to publish to prod.
        run: echo "Approved."

  publish-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [approve-prod]
    uses: jmpa-io/pipelines/.github/workflows/50-upload-artifacts-to-s3.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # v1.1.0
    with:
      artifact: startpage.jcleal.me
      environment: prod
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}

  smoke-test-prod:
    needs: [publish-prod]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the live site.
        run: |
          for path in /; do
            curl -fsS --retry 8 --retry-delay 15 --retry-all-errors -o /dev/null "https://startpage.jcleal.me${path}"
            echo "ok https://startpage.jcleal.me${path}"
          done

  post-to-slack:
    needs: [lint, build-website, deploy, upload-website, smoke-test, approve-prod, publish-prod, smoke-test-prod]
    if: always()
    uses: jmpa-io/pipelines/.github/workflows/99-post-to-slack.yml@ce5c5b9a18da6c3975e7bd71f9f7c99b9b49ef2f # v1.1.0
    with:
      needs: ${{ toJSON(needs) }}
    secrets:
      WEBHOOK: ${{ secrets.SLACK_GITHUB_NOTIFICATIONS_WEBHOOK }}


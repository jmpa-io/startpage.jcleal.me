---
name: CI/CD
on:
  push:
    paths:
      - '.github/workflows/cicd.yml'
      - 'cf/**'
      - 'src/**'
      - 'Makefile*'
  workflow_dispatch:
  repository_dispatch:
    types: [update-cicd]

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  lint:
    uses: jmpa-io/pipelines/.github/workflows/10-lint.yml@main
    secrets:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      AWS_RUNNER_ROLE_NAME: ${{ secrets.AWS_RUNNER_ROLE_NAME }}
      ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}

  build-website:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout.
        uses: actions/checkout@v4

      - name: Upload artifact.
        uses: actions/upload-artifact@v4
        with:
          name: startpage.jcleal.me
          path: src/*
          if-no-files-found: error
          retention-days: 7

  # NOTE: CI deliberately does not deploy or sync this site. The live CloudFormation stack (startpage-jcleal-me) predates the
  # template in cf/ (different logical IDs, fixed-name resources), so deploying over it would fail the
  # existence check, or replace live resources if it ever passed. Migrate the live stack (resource import)
  # before re-adding a deploy job.

  post-to-slack:
    needs: [lint, build-website]
    if: always()
    uses: jmpa-io/pipelines/.github/workflows/99-post-to-slack.yml@main
    with:
      needs: ${{ toJSON(needs) }}
    secrets:
      WEBHOOK: ${{ secrets.SLACK_GITHUB_NOTIFICATIONS_WEBHOOK }}

<!-- based on https://notabug.org/nytly/home-->
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <title>💻</title>
  <!-- colours + day/night are applied here, before first paint (shared master: jcleal.me/static/js/palette.js) -->
  <script src="js/palette.js"></script>
  <script>
    Palette.init({
      triggerId: 'palette-trigger',
      popupId: 'palette-popup',
      customIds: { primary: 'custom-primary', secondary: 'custom-secondary', reset: 'custom-reset', note: 'custom-note' },
      toggleId: 'scheme-toggle',
      onScheme: function (scheme, toggle) {
        if (!toggle) return;
        toggle.textContent = scheme === 'dark' ? '[night]' : '[day]';
      }
    });
  </script>
</head>

<body>
  <div class="jc-controls">
    <button class="scheme-toggle" id="scheme-toggle" type="button" aria-label="Toggle day/night" title="Toggle day/night">[night]</button>
    <div class="palette-wrap">
      <button class="palette-trigger" id="palette-trigger" type="button" aria-label="Colours" aria-haspopup="true" aria-expanded="false" title="Colours">[colours]</button>
      <div class="palette-popup" id="palette-popup" role="dialog" aria-label="Colours">
        <label>Primary <input type="color" id="custom-primary" value="#c04828"></label>
        <label>Secondary <input type="color" id="custom-secondary" value="#2f7fae"></label>
        <button type="button" class="custom-reset" id="custom-reset">Reset</button>
        <span class="custom-note" id="custom-note" role="status"></span>
      </div>
    </div>
  </div>

  <!-- the links, groups and notes are rendered by js/app.js from js/store.js (localStorage "startpage.v1") -->
  <main class="sp-window" id="sp-window" aria-label="start page">
    <div class="sp-bar" id="sp-bar">
      <span class="sp-title">jcleal@home ~</span>
    </div>
    <div class="sp-tools" role="toolbar" aria-label="Start page tools">
      <button type="button" class="sp-tool" id="sp-edit" aria-pressed="false">[edit]</button>
      <button type="button" class="sp-tool" id="sp-add-note">[+note]</button>
      <button type="button" class="sp-tool" id="sp-export">[export]</button>
      <button type="button" class="sp-tool" id="sp-import-btn">[import]</button>
      <input type="file" id="sp-import" accept="application/json,.json" hidden aria-label="Import JSON file">
    </div>
    <div class="terminal">
      <div class="prompt">[<span class="user">jcleal</span>@<span>home</span> ~]$ tree</div>
      <div class="tree" id="sp-tree"></div>
      <noscript><p>This page needs JavaScript to show your links.</p></noscript>
      <div class="prompt">[<span class="user">jcleal</span>@<span>home</span> ~]$ google</div>
      <form action="https://google.com/search" method="GET">
        <h1>search: </h1>
        <input type="text" name="q" autofocus="autofocus" aria-label="search" />
      </form>
    </div>
    <div class="sp-status" id="sp-status" role="status"></div>
  </main>
  <div class="sp-notes" id="sp-notes"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
